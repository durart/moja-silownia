name: Compact workout regression
on:
  pull_request:
    paths:
      - 'modules/compact-workout-*.mjs'
      - 'styles/compact-workout.css'
      - 'preview/modules/compact-workout-*.mjs'
      - 'tests/compact-workout*'
      - '.github/workflows/compact-workout.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/compact-workout.test.mjs
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/compact-workout-browser-smoke.cjs
