name: 4.1.3 isolated safety candidate
on:
  push:
    branches: [feature/data-quality-safety-4.1.3, release/4.1.3]
  pull_request:
    branches: [main]
    paths:
      - 'preview/modules/set-observation.js'
      - 'modules/set-observation.js'
      - 'tests/data-quality-safety.test.cjs'
      - '.github/workflows/data-quality-safety-413.yml'
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm exact head and run focused safety tests
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          node --test tests/data-quality-safety.test.cjs
          SAFETY_SURFACE=production node --test tests/data-quality-safety.test.cjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Preview browser safety without publication
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/quality-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/preview/ >/dev/null && break; sleep 1; done
          node tests/data-quality-safety-browser.cjs
          SAFETY_SURFACE=production node tests/data-quality-safety-browser.cjs
  preview-domain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reuse existing domain tests against isolated preview
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/preview-domain"
          cp -a preview/. "$RUNNER_TEMP/preview-domain/"
          cp -a tests "$RUNNER_TEMP/preview-domain/tests"
          cd "$RUNNER_TEMP/preview-domain"
          node --test tests/trainer-preparation.test.cjs tests/trainer-drafts.test.cjs tests/adaptive-adapter.test.cjs tests/adaptive-evidence.test.cjs tests/adaptive-prescription.test.cjs tests/adaptive-trends.test.cjs tests/adaptive-recovery.test.cjs tests/adaptive-explanation.test.cjs tests/progress-v2.test.cjs
  mammoth-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve pinned libraries and audit
        run: |
          mkdir dependency-check
          cd dependency-check
          npm init -y
          npm install --ignore-scripts --save-exact pdfjs-dist@6.5.438 mammoth@1.13.0
          npm audit --omit=dev --audit-level=moderate
      - name: Generate real document fixtures and test dependencies
        run: |
          mkdir -p dependency-check/fixtures
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          root = Path('dependency-check/fixtures')
          stream = b'BT /F1 12 Tf 50 750 Td (TRENING 1) Tj ET'
          objects = [b'<< /Type /Catalog /Pages 2 0 R >>', b'<< /Type /Pages /Kids [3 0 R] /Count 1 >>', b'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>', b'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>', b'<< /Length '+str(len(stream)).encode()+b' >>\nstream\n'+stream+b'\nendstream']
          pdf = bytearray(b'%PDF-1.4\n')
          offsets = [0]
          for i, obj in enumerate(objects, 1):
              offsets.append(len(pdf))
              pdf.extend(str(i).encode()+b' 0 obj\n'+obj+b'\nendobj\n')
          xref = len(pdf)
          pdf.extend(b'xref\n0 6\n0000000000 65535 f \n')
          for offset in offsets[1:]:
              pdf.extend(f'{offset:010d} 00000 n \n'.encode())
          pdf.extend(f'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n{xref}\n%%EOF\n'.encode())
          (root/'plan.pdf').write_bytes(pdf)
          with ZipFile(root/'plan.docx','w') as z:
              z.writestr('[Content_Types].xml','<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>')
              z.writestr('_rels/.rels','<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>')
              z.writestr('word/document.xml','<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body><w:p><w:r><w:t>TRENING 1</w:t></w:r></w:p><w:p><w:r><w:t>Bench press</w:t></w:r></w:p></w:body></w:document>')
          PY
          SECURITY_VENDOR_ROOT="$PWD/dependency-check" node --test tests/security-real-documents.test.mjs
      - name: Identify official browser bundle without installing into application
        run: |
          sha256sum dependency-check/node_modules/mammoth/mammoth.browser.min.js dependency-check/node_modules/mammoth/LICENSE dependency-check/package-lock.json
          node -p "require('./dependency-check/node_modules/mammoth/package.json').version"
  complete-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs tests/*.test.js tests/*.test.cjs
      - name: Verify immutable release and exact archive
        run: |
          set -euo pipefail
          for sha in $(node -e 'const p=require("./tests/release-expectations.json").integrity;console.log([...new Set([p.productionRef,p.previewRef,p.stagingBaseRef,p.previousReleaseRef])].join(" "))'); do git fetch --no-tags --depth=1 origin "$sha"; done
          node scripts/verify-staging-release.cjs
          git fetch --no-tags --depth=1 origin a3efe76b269b2e34bada7f4b65b43a8b0de9f2f0
          node scripts/verify-promotion-413.cjs
          mkdir "$RUNNER_TEMP/exact-candidate"
          git archive --format=tar HEAD > "$RUNNER_TEMP/exact-candidate.tar"
          tar -xf "$RUNNER_TEMP/exact-candidate.tar" -C "$RUNNER_TEMP/exact-candidate"
          node -e 'const {verifyArchive}=require("./scripts/verify-staging-release.cjs");console.log("Verified archive entries:",verifyArchive(process.cwd(),require("child_process").execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim(),process.env.RUNNER_TEMP+"/exact-candidate"))'
          mkdir "$RUNNER_TEMP/baseline"
          git archive "$(node -p 'require("./tests/release-expectations.json").integrity.previousReleaseRef')" | tar -x -C "$RUNNER_TEMP/baseline"
          (cd "$RUNNER_TEMP/baseline" && node --test tests/characterization-411.cjs)
      - uses: actions/upload-artifact@v4
        with:
          name: exact-413-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/exact-candidate.tar
          retention-days: 7
          if-no-files-found: error
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Upgrade and rollback real previous preview
        run: |
          set -euo pipefail
          sha=$(node -p 'require("./tests/release-expectations.json").integrity.previousReleaseRef')
          git fetch --no-tags --depth=1 origin "$sha"
          mkdir "$RUNNER_TEMP/legacy-preview"
          git archive "$sha" | tar -x -C "$RUNNER_TEMP/legacy-preview"
          LEGACY_APP="$RUNNER_TEMP/legacy-preview" node tests/preview-upgrade-browser.cjs
          LEGACY_APP="$RUNNER_TEMP/legacy-preview" node tests/upgrade-browser.cjs
      - name: Existing adaptive browser and storage recovery
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/adaptive-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/preview/ >/dev/null && break; sleep 1; done
          node tests/adaptive-browser.cjs
          node tests/storage-recovery-browser.cjs
  importer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify committed vendor integrity
        run: |
          cat > /tmp/expected-vendor.sha256 <<'EOF'
          6663bbd049205d38a496ccacb412a151980b444627d38de218b3b809aef330f1  ./mammoth/LICENSE
          92914a3708cfdf1e62cb553d1856a7fedab21da83d8ee82845de2f897b368cab  ./mammoth/mammoth.browser.min.js
          3c25f22ba8c536cb6683ef00a680db0b4f57deffdb61d38952e94b2eb58a3c73  ./package-lock.json
          0d542e0c8804e39aa7f37eb00da5a762149dc682d7829451287e11b938e94594  ./pdfjs/LICENSE
          522ad2c83bc8a0010e7f0cc60d0892b77c8d2bf2c9702dc12288311d94270f42  ./pdfjs/pdf.min.mjs
          b4c8353ded0d88d2e2009574a29eb4e0c3ff7e942ecdf51ef5f71566a9667f31  ./pdfjs/pdf.worker.min.mjs
          EOF
          (cd vendor && sha256sum -c /tmp/expected-vendor.sha256 && sha256sum -c SHA256SUMS)
          (cd preview/vendor && sha256sum -c /tmp/expected-vendor.sha256 && sha256sum -c SHA256SUMS)
          diff -qr vendor preview/vendor
      - name: Resolve pinned libraries and audit
        run: |
          set -euo pipefail
          mkdir dependency-check
          cp vendor/package-lock.json dependency-check/
          cd dependency-check
          node -e 'const fs=require("fs");const root=require("./package-lock.json").packages[""];fs.writeFileSync("package.json",JSON.stringify({name:root.name,version:root.version,dependencies:root.dependencies}))'
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=moderate
          cmp node_modules/mammoth/mammoth.browser.min.js ../vendor/mammoth/mammoth.browser.min.js
          cmp node_modules/mammoth/LICENSE ../vendor/mammoth/LICENSE
          cmp package-lock.json ../vendor/package-lock.json
      - name: Verify installed preview package and exact committed lock
        run: |
          set -euo pipefail
          mkdir preview-dependency-check
          cp preview/vendor/package-lock.json preview-dependency-check/
          cd preview-dependency-check
          node -e 'const fs=require("fs");const root=require("./package-lock.json").packages[""];fs.writeFileSync("package.json",JSON.stringify({name:root.name,version:root.version,dependencies:root.dependencies}))'
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=moderate
          cmp node_modules/mammoth/mammoth.browser.min.js ../preview/vendor/mammoth/mammoth.browser.min.js
          cmp node_modules/mammoth/LICENSE ../preview/vendor/mammoth/LICENSE
          cmp package-lock.json ../preview/vendor/package-lock.json
      - name: Generate real document fixtures and test dependencies
        run: |
          mkdir -p dependency-check/fixtures
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          root = Path('dependency-check/fixtures')
          stream = b'BT /F1 12 Tf 50 750 Td (TRENING 1) Tj ET'
          objects = [b'<< /Type /Catalog /Pages 2 0 R >>', b'<< /Type /Pages /Kids [3 0 R] /Count 1 >>', b'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>', b'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>', b'<< /Length '+str(len(stream)).encode()+b' >>\nstream\n'+stream+b'\nendstream']
          pdf = bytearray(b'%PDF-1.4\n')
          offsets = [0]
          for i, obj in enumerate(objects, 1):
              offsets.append(len(pdf))
              pdf.extend(str(i).encode()+b' 0 obj\n'+obj+b'\nendobj\n')
          xref = len(pdf)
          pdf.extend(b'xref\n0 6\n0000000000 65535 f \n')
          for offset in offsets[1:]:
              pdf.extend(f'{offset:010d} 00000 n \n'.encode())
          pdf.extend(f'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n{xref}\n%%EOF\n'.encode())
          (root/'plan.pdf').write_bytes(pdf)
          with ZipFile(root/'plan.docx','w') as z:
              z.writestr('[Content_Types].xml','<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>')
              z.writestr('_rels/.rels','<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>')
              z.writestr('word/document.xml','<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body><w:p><w:r><w:t>TRENING 1</w:t></w:r></w:p><w:p><w:r><w:t>Bench press</w:t></w:r></w:p></w:body></w:document>')
          PY
          SECURITY_VENDOR_ROOT="$PWD/dependency-check" node --test tests/security-real-documents.test.mjs
          python3 tests/generate-docx-compatibility.py dependency-check/fixtures/complex.docx
          cp -a dependency-check/fixtures preview-dependency-check/
          SECURITY_VENDOR_ROOT="$PWD/preview-dependency-check" node --test tests/security-real-documents.test.mjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/security-browser.cjs
