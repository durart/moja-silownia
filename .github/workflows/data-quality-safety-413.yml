name: 4.1.3 isolated safety candidate
on:
  push:
    branches: [feature/data-quality-safety-4.1.3]
  pull_request:
    branches: [main]
    paths:
      - 'preview/modules/set-observation.js'
      - 'tests/data-quality-safety.test.cjs'
      - '.github/workflows/data-quality-safety-413.yml'
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm exact head and run focused safety tests
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          node --test tests/data-quality-safety.test.cjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Preview browser safety without publication
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/quality-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/preview/ >/dev/null && break; sleep 1; done
          node tests/data-quality-safety-browser.cjs
  preview-domain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reuse existing domain tests against isolated preview
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/preview-domain"
          cp -a preview/. "$RUNNER_TEMP/preview-domain/"
          cp -a tests "$RUNNER_TEMP/preview-domain/tests"
          cd "$RUNNER_TEMP/preview-domain"
          node --test tests/trainer-preparation.test.cjs tests/trainer-drafts.test.cjs tests/adaptive-adapter.test.cjs tests/adaptive-evidence.test.cjs tests/adaptive-prescription.test.cjs tests/adaptive-trends.test.cjs tests/adaptive-recovery.test.cjs tests/adaptive-explanation.test.cjs tests/progress-v2.test.cjs
  mammoth-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve pinned libraries and audit
        run: |
          mkdir dependency-check
          cd dependency-check
          npm init -y
          npm install --ignore-scripts --save-exact pdfjs-dist@6.5.438 mammoth@1.13.0
          npm audit --omit=dev --audit-level=moderate
      - name: Generate real document fixtures and test dependencies
        run: |
          mkdir -p dependency-check/fixtures
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          root = Path('dependency-check/fixtures')
          stream = b'BT /F1 12 Tf 50 750 Td (TRENING 1) Tj ET'
          objects = [b'<< /Type /Catalog /Pages 2 0 R >>', b'<< /Type /Pages /Kids [3 0 R] /Count 1 >>', b'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>', b'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>', b'<< /Length '+str(len(stream)).encode()+b' >>\nstream\n'+stream+b'\nendstream']
          pdf = bytearray(b'%PDF-1.4\n')
          offsets = [0]
          for i, obj in enumerate(objects, 1):
              offsets.append(len(pdf))
              pdf.extend(str(i).encode()+b' 0 obj\n'+obj+b'\nendobj\n')
          xref = len(pdf)
          pdf.extend(b'xref\n0 6\n0000000000 65535 f \n')
          for offset in offsets[1:]:
              pdf.extend(f'{offset:010d} 00000 n \n'.encode())
          pdf.extend(f'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n{xref}\n%%EOF\n'.encode())
          (root/'plan.pdf').write_bytes(pdf)
          with ZipFile(root/'plan.docx','w') as z:
              z.writestr('[Content_Types].xml','<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>')
              z.writestr('_rels/.rels','<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>')
              z.writestr('word/document.xml','<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body><w:p><w:r><w:t>TRENING 1</w:t></w:r></w:p><w:p><w:r><w:t>Bench press</w:t></w:r></w:p></w:body></w:document>')
          PY
          SECURITY_VENDOR_ROOT="$PWD/dependency-check" node --test tests/security-real-documents.test.mjs
      - name: Identify official browser bundle without installing into application
        run: |
          sha256sum dependency-check/node_modules/mammoth/mammoth.browser.min.js dependency-check/node_modules/mammoth/LICENSE dependency-check/package-lock.json
          node -p "require('./dependency-check/node_modules/mammoth/package.json').version"
