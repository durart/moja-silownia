name: 4.1.3 isolated safety candidate
on:
  push:
    branches: [feature/data-quality-safety-4.1.3]
  pull_request:
    branches: [main]
    paths:
      - 'preview/modules/set-observation.js'
      - 'tests/data-quality-safety.test.cjs'
      - '.github/workflows/data-quality-safety-413.yml'
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm exact head and run focused safety tests
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          node --test tests/data-quality-safety.test.cjs
