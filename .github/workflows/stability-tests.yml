name: Stabilization regression tests

on:
  pull_request:
    paths:
      - 'index.html'
      - 'plan-importer.js'
      - 'sw.js'
      - 'modules/**'
      - 'tests/**'
      - '.github/workflows/stability-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute regression suite
        run: node --test tests/*.test.mjs
