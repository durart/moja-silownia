name: Calisthenics program candidate regression
on:
  pull_request:
    paths:
      - 'preview/modules/circuit-core.js'
      - 'preview/modules/programs-*.js'
      - 'preview/modules/programs-*.mjs'
      - 'tests/calisthenics-programs*'
      - '.github/workflows/calisthenics-programs-candidate.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check preview/modules/programs-ui.mjs
      - run: node --test tests/calisthenics-programs.test.cjs
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/calisthenics-programs-browser.cjs
