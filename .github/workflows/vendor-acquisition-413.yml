name: 4.1.3 vendor acquisition
on:
  push:
    branches: [feature/data-quality-safety-4.1.3]
    paths: ['.github/workflows/vendor-acquisition-413.yml']
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Acquire public pinned npm distribution and verify
        run: |
          set -euo pipefail
          mkdir dependency-check
          cd dependency-check
          npm init -y
          npm install --ignore-scripts --save-exact pdfjs-dist@6.5.438 mammoth@1.13.0
          npm audit --omit=dev --audit-level=moderate
          echo '92914a3708cfdf1e62cb553d1856a7fedab21da83d8ee82845de2f897b368cab  node_modules/mammoth/mammoth.browser.min.js' | sha256sum -c -
          echo '6663bbd049205d38a496ccacb412a151980b444627d38de218b3b809aef330f1  node_modules/mammoth/LICENSE' | sha256sum -c -
          sha256sum package-lock.json
          python3 - <<'PY'
          import base64, hashlib
          from pathlib import Path
          for name, file in [('BUNDLE','node_modules/mammoth/mammoth.browser.min.js'),('LOCK','package-lock.json')]:
              data=Path(file).read_bytes()
              encoded=base64.b64encode(data).decode('ascii')
              print('PUBLIC_VENDOR_META '+name+' '+str(len(data))+' '+hashlib.sha256(data).hexdigest())
              for index in range(0,len(encoded),4096):
                  print('PUBLIC_VENDOR_CHUNK '+name+' '+str(index//4096)+' '+encoded[index:index+4096])
          PY
