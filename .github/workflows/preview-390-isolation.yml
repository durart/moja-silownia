name: RC390 isolated browser acceptance
on:
  push:
    branches: [staging/preview-390-isolated]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8390 --bind 127.0.0.1 &
          node tests/preview-390-isolation.cjs
