name: Independent staging release
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch reviewed immutable release references
        run: |
          set -euo pipefail
          mapfile -t refs < <(node -e 'const p=require("./tests/release-expectations.json").integrity; for(const sha of new Set([p.productionRef,p.previewRef,p.stagingBaseRef,p.previousReleaseRef])) { if(!/^[a-f0-9]{40}$/.test(sha)) process.exit(1); console.log(sha); }')
          test "${#refs[@]}" -gt 0
          for sha in "${refs[@]}"; do git fetch --no-tags --depth=1 origin "$sha"; done
      - name: Verify independent surfaces and release integrity
        run: node scripts/verify-staging-release.cjs
      - run: node --test tests/staging-release.test.cjs tests/calisthenics-programs.test.cjs tests/musclemap-hybrid.test.cjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Verify preview upgrade and rollback against the previous preview
        run: |
          mkdir -p "$RUNNER_TEMP/legacy-preview"
          git archive "$(node -p 'require("./tests/release-expectations.json").integrity.previousReleaseRef')" | tar -x -C "$RUNNER_TEMP/legacy-preview"
          LEGACY_APP="$RUNNER_TEMP/legacy-preview" node tests/preview-upgrade-browser.cjs
