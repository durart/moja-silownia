name: Exercise identity migration tests
on:
  push:
    branches:
      - feature/exercise-catalog-deduplication
  pull_request:
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/exercise-identity.test.mjs tests/exercise-migration.test.mjs
