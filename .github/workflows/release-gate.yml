name: Release Gate
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          kind="$(node scripts/release-gate.mjs "$BASE" "$HEAD")"
          case "$kind" in staging|production|infrastructure) ;; *) exit 1 ;; esac
          printf 'kind=%s\n' "$kind" >> "$GITHUB_OUTPUT"
      - run: node --test tests/*.test.mjs
  gate:
    name: release-gate
    if: always()
    needs: regression
    runs-on: ubuntu-latest
    steps:
      - env:
          KIND: ${{ needs.regression.outputs.kind }}
          REGRESSION: ${{ needs.regression.result }}
        run: |
          test "$REGRESSION" = success
          case "$KIND" in staging|production|infrastructure) ;; *) exit 1 ;; esac
          printf 'Classification: %s. This check is not deployment approval.\n' "$KIND"
