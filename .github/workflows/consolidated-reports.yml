name: Consolidated reports
on:
  pull_request:
    paths:
      - 'progress-*.js'
      - 'tests/consolidated-reports.test.cjs'
      - '.github/workflows/consolidated-reports.yml'
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check progress-ui-v2.js
      - run: node --check progress-report-dashboard.js
      - run: node --test tests/consolidated-reports.test.cjs
