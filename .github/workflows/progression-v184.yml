name: Moja Silownia production and staging regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  progression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify progression, profile and existing regression tests
        run: node --test tests/production-progression-v2.test.cjs tests/progression-v2.test.cjs tests/session-mode.test.cjs tests/progression-v2-staging.test.cjs tests/progression-v184.test.cjs tests/advisor-stage3.test.cjs tests/*.test.mjs
      - name: Verify deployed staging and production assets
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          BASE='https://durart.github.io/moja-silownia/'
          for prefix in '' 'preview/'; do
            # Compare with this commit, not historical release numbers.
            for asset in index.html sw.js muscle-anatomy-art.js profile-core.js profile-ui.js profile.css assistant/session-mode.js assistant/assistant-core.js assistant/assistant-progression.js assistant/equipment-settings-ui.js assistant/assistant-progression-ui.js; do
              expected="$prefix$asset"
              actual="$(mktemp)"
              matched=false
              for attempt in $(seq 1 24); do
                if curl -fsSL --max-time 25 "$BASE$expected?verify=${GITHUB_SHA}" -o "$actual" && cmp -s "$expected" "$actual"; then
                  matched=true
                  break
                fi
                sleep 6
              done
              if [ "$matched" != true ]; then
                echo "Deployed asset does not match commit: $expected"
                exit 1
              fi
              rm -f "$actual"
            done
          done
