name: Moja Silownia 1.9.0 regression and release smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  progression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify progression, profile and existing regression tests
        run: node --test tests/progression-v2.test.cjs tests/progression-v184.test.cjs tests/advisor-stage3.test.cjs tests/*.test.mjs
      - name: Verify live profile staging
        run: |
          set -euo pipefail
          PREVIEW='https://durart.github.io/moja-silownia/preview/'
          PROD='https://durart.github.io/moja-silownia/'
          for attempt in $(seq 1 10); do
            curl -fsSL --max-time 25 "$PREVIEW" -o /tmp/staging.html || true
            if grep -q 'TEST v1.9.0' /tmp/staging.html 2>/dev/null; then
              break
            fi
            sleep 8
          done
          grep -q 'Moja Siłownia TEST v1.9.0' /tmp/staging.html
          grep -q 'moja-silownia-preview-v01' /tmp/staging.html
          grep -q 'id="profileContent"' /tmp/staging.html
          for asset in profile-core.js profile-ui.js sw.js; do
            curl -fsSL --retry 3 --retry-all-errors --retry-delay 3 --max-time 25 \
              "$PREVIEW$asset" -o "/tmp/$asset"
            node --check "/tmp/$asset"
          done
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 3 --max-time 25 \
            "$PREVIEW""profile.css" -o /tmp/profile.css
          grep -q 'relativeStrength' /tmp/profile-core.js
          grep -q 'profileWeightDate' /tmp/profile-ui.js
          grep -q 'v190-profile' /tmp/sw.js
      - name: Verify production release after merge
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          PROD='https://durart.github.io/moja-silownia/'
          for attempt in $(seq 1 24); do
            curl -fsSL --max-time 25 "$PROD" -o /tmp/production.html || true
            if grep -q 'Moja Siłownia v1.9.0' /tmp/production.html 2>/dev/null; then
              break
            fi
            sleep 6
          done
          grep -q 'Moja Siłownia v1.9.0' /tmp/production.html
          grep -q 'id="profileContent"' /tmp/production.html
          grep -q "const key='moja-silownia-v01'" /tmp/production.html
          for asset in profile-core.js profile-ui.js sw.js; do
            curl -fsSL --retry 3 --retry-all-errors --retry-delay 3 --max-time 25 \
              "$PROD$asset" -o "/tmp/prod-$asset"
            node --check "/tmp/prod-$asset"
          done
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 3 --max-time 25 \
            "$PROD""profile.css" -o /tmp/prod-profile.css
          grep -q 'moja-silownia-shell-v37-profile-1.9.0' /tmp/prod-sw.js
          grep -q 'profile-core.js?v=190' /tmp/prod-sw.js
          grep -q 'profile-ui.js?v=190' /tmp/prod-sw.js
          grep -q 'profile.css?v=190' /tmp/prod-sw.js
