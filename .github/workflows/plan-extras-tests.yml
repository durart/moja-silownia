name: Plan extra exercises — regression
on:
  push:
    branches:
      - main
      - feature/plan-extra-exercises-v169
      - feature/summary-sport-performance-v2
      - feature/ai-form-check
  pull_request:
    paths:
      - 'index.html'
      - 'sport-performance.css'
      - 'tests/plan-extras.test.mjs'
      - 'tests/summary.test.mjs'
      - 'summary-core.js'
      - 'summary-ui.js'
      - 'summary-export.js'
      - 'summary.css'
      - '.github/workflows/plan-extras-tests.yml'
      - 'formcheck/**'
      - 'formcheck.css'
      - 'tests/formcheck-engine.test.mjs'
      - 'tests/fixtures/formcheck-squat-*.json'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript files
        run: |
          node --check plan-importer.js
          node --check ui-enhancements.js
          node --check formcheck/formcheck-engine.js
          node --check formcheck/formcheck-library.js
          node --check formcheck/formcheck-pose.js
          node --check formcheck/formcheck-ui.js
      - name: Workout regression suites
        run: node --test tests/*.test.mjs
