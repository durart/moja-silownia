name: Progress 3 browser smoke
on:
  push:
    branches: [feature/progress-3-foundation-20261123]
  pull_request:
    paths:
      - 'progress-core-v2.js'
      - 'progress-ui-v2.js'
      - 'tests/progress-browser-smoke.cjs'
      - '.github/workflows/progress-3-browser.yml'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/progress-browser-smoke.cjs
