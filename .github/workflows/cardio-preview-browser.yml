name: Cardio preview acceptance regression
on:
  pull_request:
    paths:
      - 'preview/index.html'
      - 'preview/modules/cardio-*.js'
      - 'preview/sw.js'
      - 'tests/cardio-preview-browser-smoke.cjs'
      - '.github/workflows/cardio-preview-browser.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/cardio-preview-browser-smoke.cjs
