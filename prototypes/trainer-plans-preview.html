<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moja Siłownia — Plany trenera TEST</title><style>:root{font-family:system-ui;color:#eef5ff;background:#08121c}body{max-width:960px;margin:auto;padding:20px}h1{margin-bottom:4px}.note{color:#9bb4c9}.warn{background:#17283a;border:1px solid #3b657c;padding:12px;border-radius:12px}button{cursor:pointer;background:#152b3b;border:1px solid #345468;color:white;padding:9px 13px;border-radius:12px;margin:3px}button.active{background:#0c91aa;border-color:#38cfe6}article{background:#102332;border:1px solid #274557;padding:16px;border-radius:16px;margin:12px 0}small{color:#9bb4c9}table{border-collapse:collapse;width:100%;margin-top:14px}td,th{padding:9px 6px;border-bottom:1px solid #2c4555;text-align:left;font-size:14px}details{margin-top:10px}summary{cursor:pointer;color:#7ce4f1}#filters{margin:16px 0}</style><h1>Plany trenera <small>TEST</small></h1><p class="note">10 programów · podgląd wyłącznie do oceny · bez zapisu treningów</p><div class="warn">To izolowany prototyp. Nie zapisuje danych, nie zmienia Twoich planów i nie łączy się z produkcją. Plan 9 to obwód z uproszczonymi zamiennikami, a plan 10 wymaga obsługi superserii.</div><nav id="filters"></nav><main id="cards"></main><script>const plans=[["FBW","FBW Siła i Podstawy","55–65 min",[["Przysiad ze sztangą",4,"6–8",120],["Wyciskanie sztangi na ławce płaskiej",4,"6–8",120],["Wiosłowanie sztangą w opadzie",4,"8–10",90],["Wyciskanie sztangi nad głowę siedząc",3,"8–10",90],["Uginanie ramion ze sztangą łamaną",3,"10–12",60],["Plank",3,"45–60 s",60]]],["FBW","FBW Hipertrofia i Maszyny","55–65 min",[["Martwy ciąg rumuński z hantlami",4,"8–10",90],["Wyciskanie hantli na ławce skośnej dodatniej",4,"10–12",90],["Ściąganie drążka do klatki nachwytem",4,"10–12",90],["Wznosy bokiem z hantlami",3,"12–15",60],["Prostowanie ramion na wyciągu",3,"12–15",60],["Spięcia brzucha na wyciągu klęcząc",3,"12–15",60]]]
